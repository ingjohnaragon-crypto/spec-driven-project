schema: spec-driven

# ─────────────────────────────────────────────
# ACTIVE STACK
# ─────────────────────────────────────────────
stack: vault-smart-contracts

# ─────────────────────────────────────────────
# ACTIVE AGENT
# Change this to switch how prompts are delivered.
# Must match one of the keys under "agents:" below.
# ─────────────────────────────────────────────
agent: claude-code

# ─────────────────────────────────────────────
# ACTIVE LANGUAGE
# Output language for everything the framework generates:
# code, comments, docs, Jira content, commits, PR titles/bodies.
# Change with: os-language <code>
# ─────────────────────────────────────────────
language: es

# ─────────────────────────────────────────────
# STACK REGISTRY
# ─────────────────────────────────────────────
# This repo is a Vault Smart Contracts framework. The registry keeps the
# multi-stack shape (so a new stack can be added later) but ships only the
# Vault stack today.
# ─────────────────────────────────────────────
stacks:
  vault-smart-contracts:
    label: Thought Machine Vault Smart Contracts
    build_command: pip install -r requirements.txt && pip install contracts_sdk/contracts_sdk/.
    test_command: python .openspec-cli/lib/vault_lint.py contracts/ && python -m pytest tests/ -v
    run_command: python .openspec-cli/lib/vault_lint.py contracts/
    lint_command: python .openspec-cli/lib/vault_lint.py contracts/
    coverage_command: python .openspec-cli/lib/vault_lint.py contracts/ && python -m pytest tests/ -v --cov=contracts --cov-report=html --cov-fail-under=90
    agent: ai-specs/.agents/stacks/vault-smart-contracts.md
    standards: ai-specs/specs/stacks/vault-smart-contracts-standards.mdc
# ─────────────────────────────────────────────
# AGENT REGISTRY
# Defines how prompts are delivered to each AI assistant.
# delivery: clipboard  -> copies prompt to clipboard (manual paste)
# delivery: cli        -> executes command directly in terminal
# ─────────────────────────────────────────────
agents:
  copilot:
    label: GitHub Copilot (VS Code)
    delivery: clipboard
    command: null

  cursor:
    label: Cursor
    delivery: clipboard
    command: null

  windsurf:
    label: Windsurf
    delivery: clipboard
    command: null

  claude-code:
    label: Claude Code (CLI)
    delivery: cli
    command: claude
    args: --print

  aider:
    label: Aider (CLI)
    delivery: cli
    command: aider
    args: --message


# ─────────────────────────────────────────────
# LANGUAGE REGISTRY
# ─────────────────────────────────────────────
languages:
  en:
    label: English

  es:
    label: Español (Spanish)


# ─────────────────────────────────────────────
# JIRA
# ─────────────────────────────────────────────
jira:
  base_url: ${JIRA_BASE_URL}
  email: ${JIRA_EMAIL}
  token: ${JIRA_TOKEN}
  project_key: KAN
